name: Java solution checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile
        run: mkdir -p out && javac --release 17 -d out src/InterviewSolutions.java tests/InterviewSolutionsTest.java
      - name: Run checks
        run: java -cp out InterviewSolutionsTest
